<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" width="860" height="510" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Daily cost by share of batches with a key-only delete, by fix">
<rect width="860" height="510" fill="#fcfcfb"/>
<text x="64" y="30" font-size="17" font-weight="600" fill="#0b0b0b">Daily cost by share of batches with a key-only delete</text>
<text x="64" y="50" font-size="12.5" fill="#52514e">One merge every 5 minutes into a 3-year, 51.5 GB table, on-demand at $6.25/TiB. 0% and 100% use measured bytes billed;</text>
<text x="64" y="66" font-size="12.5" fill="#52514e">the lines between are a model (see chart.py).</text>
<line x1="64" y1="88" x2="86" y2="88" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<text x="93" y="92" font-size="12" fill="#52514e">No filter (the fallback)</text>
<line x1="394" y1="88" x2="416" y2="88" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="423" y="92" font-size="12" fill="#52514e">Split: filtered merge + DELETE by key</text>
<line x1="64" y1="108" x2="86" y2="108" stroke="#1baf7a" stroke-width="2.5" stroke-linecap="round"/>
<text x="93" y="112" font-size="12" fill="#52514e">Lookup table (key to partition)</text>
<line x1="394" y1="108" x2="416" y2="108" stroke="#eda100" stroke-width="2.5" stroke-linecap="round"/>
<text x="423" y="112" font-size="12" fill="#52514e">Deferred deletes, flushed every 6 batches</text>
<line x1="64" y1="128" x2="86" y2="128" stroke="#8a8984" stroke-width="2.5" stroke-linecap="round"/>
<text x="93" y="132" font-size="12" fill="#52514e">Every delete carries its partition value</text>
<line x1="64" y1="454.0" x2="624" y2="454.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="56" y="458.0" font-size="12" fill="#52514e" text-anchor="end">$0</text>
<line x1="64" y1="396.8" x2="624" y2="396.8" stroke="#e6e5e1" stroke-width="1"/>
<text x="56" y="400.8" font-size="12" fill="#52514e" text-anchor="end">$2</text>
<line x1="64" y1="339.6" x2="624" y2="339.6" stroke="#e6e5e1" stroke-width="1"/>
<text x="56" y="343.6" font-size="12" fill="#52514e" text-anchor="end">$4</text>
<line x1="64" y1="282.4" x2="624" y2="282.4" stroke="#e6e5e1" stroke-width="1"/>
<text x="56" y="286.4" font-size="12" fill="#52514e" text-anchor="end">$6</text>
<line x1="64" y1="225.2" x2="624" y2="225.2" stroke="#e6e5e1" stroke-width="1"/>
<text x="56" y="229.2" font-size="12" fill="#52514e" text-anchor="end">$8</text>
<line x1="64" y1="168.0" x2="624" y2="168.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="56" y="172.0" font-size="12" fill="#52514e" text-anchor="end">$10</text>
<text x="64.0" y="474" font-size="12" fill="#52514e" text-anchor="middle">0%</text>
<text x="204.0" y="474" font-size="12" fill="#52514e" text-anchor="middle">25%</text>
<text x="344.0" y="474" font-size="12" fill="#52514e" text-anchor="middle">50%</text>
<text x="484.0" y="474" font-size="12" fill="#52514e" text-anchor="middle">75%</text>
<text x="624.0" y="474" font-size="12" fill="#52514e" text-anchor="middle">100%</text>
<text x="344.0" y="498" font-size="12.5" fill="#52514e" text-anchor="middle">Share of batches with at least one delete that has no partition value</text>
<text x="64" y="158" font-size="12" fill="#52514e">USD per day</text>
